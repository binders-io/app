name: Binders
options:
  bundleIdPrefix: io.binders
  deploymentTarget:
    macOS: "14.2"
  createIntermediateGroups: true
packages:
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    from: 0.15.7
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit.git
    from: 1.1.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle.git
    from: 2.6.4
  BindersKit:
    path: Packages/BindersKit
  # Models run inside Binders on Apple silicon, for Macs where Ollama isn't allowed.
  MLXSwiftLM:
    url: https://github.com/ml-explore/mlx-swift-lm.git
    from: 3.32.3
  SwiftTransformers:
    url: https://github.com/huggingface/swift-transformers.git
    from: 1.3.4
  # The team database: Postgres over TLS, for teams that share binders through one (docs/plans/team-database.md). The
  # Mac only: the iPhone sees shared binders through its Mac.
  PostgresNIO:
    url: https://github.com/vapor/postgres-nio.git
    from: 1.33.1
  # Notes edited together live on a team database (lane DB3): each shared note is an Automerge document, so two people
  # typing in one note both keep their words. The Mac only, as PostgresNIO: the iPhone edits shared notes through its Mac.
  Automerge:
    url: https://github.com/automerge/automerge-swift.git
    exactVersion: 0.7.2
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.2"
    DEVELOPMENT_TEAM: 87LFD98HJU
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development: Helder Feixas (2SNS7F6FAZ)"
    MARKETING_VERSION: "0.12.0"
    CURRENT_PROJECT_VERSION: "42"
targets:
  Binders:
    type: application
    platform: macOS
    sources:
      # Binders/ includes Binders/Resources/Mermaid/mermaid.min.js (lane MM1), copied in as a resource: the note editor
      # draws Mermaid diagrams with it, offline. The Mac only; the iPhone shows the diagrams' Markdown.
      - path: Binders
      # All-day capture's listening and cutting, the same on the Mac and the iPhone.
      - path: CaptureShared
    info:
      path: Binders/Resources/Info.plist
      properties:
        CFBundleName: Binders
        CFBundleDisplayName: Binders
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        CFBundleURLTypes:
          - CFBundleURLName: io.binders.mac
            CFBundleURLSchemes: [binders]
            CFBundleTypeRole: Viewer
        NSLocalNetworkUsageDescription: Binders lets the iPhones you pair with this Mac connect to it over your network, so your notes and to-dos stay on your own devices.
        NSBonjourServices: [_binders._tcp]
        # A model server you run yourself (Ollama, llama.cpp, vLLM) is usually plain http, often on another machine over
        # Tailscale, and macOS only lets an app reach that if it allows it. Binders' own addresses are all https.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSMicrophoneUsageDescription: Binders listens only while you hold your dictation shortcut, record a meeting, or have All-day capture on, and transcribes on this Mac.
        # Binders files: conversations from the iPhone, by AirDrop, Files or Mail.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Binders file
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [io.binders.transfer]
          # An invite to a team database (lane DB2): Settings → Team asks before it joins.
          - CFBundleTypeName: Binders team invite
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [io.binders.team-invite]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: io.binders.transfer
            UTTypeDescription: Binders file
            UTTypeConformsTo: [public.data, public.content]
            UTTypeTagSpecification:
              public.filename-extension: [binders]
              public.mime-type: [application/x-binders]
          - UTTypeIdentifier: io.binders.team-invite
            UTTypeDescription: Binders team invite
            UTTypeConformsTo: [public.data, public.content]
            UTTypeTagSpecification:
              public.filename-extension: [binders-invite]
        NSAudioCaptureUsageDescription: Binders records what other meeting participants say so it can take notes on this Mac.
        NSCalendarsFullAccessUsageDescription: Binders uses your calendar to title meetings and name attendees in meeting notes, and to add the events you ask for out loud.
        NSHumanReadableCopyright: © 2026 Helder Feixas
        SUFeedURL: https://binders.io/appcast.xml
        SUPublicEDKey: C/rZOrAgEm5p5fW21qnUggPEQxu3edbA42Qn7qd3BfE=
        SUScheduledCheckInterval: 86400
        SUEnableSystemProfiling: false
    entitlements:
      path: Binders/Resources/Binders.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.binders.mac
        PRODUCT_NAME: Binders
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
    dependencies:
      - package: FluidAudio
      - package: WhisperKit
        product: WhisperKit
      - package: Sparkle
      - package: BindersKit
      - package: MLXSwiftLM
        product: MLXLLM
      - package: MLXSwiftLM
        product: MLXLMCommon
      - package: MLXSwiftLM
        product: MLXEmbedders
      # Distill's reply held to a JSON schema on a model running in Binders (lane DS3): xgrammar, compiled from source.
      - package: MLXSwiftLM
        product: MLXGuidedGeneration
      - package: SwiftTransformers
        product: Tokenizers
      - package: PostgresNIO
      # Shared notes' Automerge documents (lane DB3), in a framework of their own: see BindersAutomerge.
      - target: BindersAutomerge
  # Automerge for shared notes (lane DB3), on its own: its Rust core is a static library carrying Rust's standard library,
  # as FluidAudio's text processing is, and two of those can't be linked into one binary (both define
  # rust_eh_personality). In a framework of its own, embedded in the app, each has its own. Only Foundation crosses
  # between them. The Mac only, as PostgresNIO: the iPhone edits shared notes through its Mac.
  BindersAutomerge:
    type: framework
    platform: macOS
    sources:
      - path: AutomergeBridge
        excludes: [exports.txt]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.binders.mac.automerge
        PRODUCT_NAME: BindersAutomerge
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        DEFINES_MODULE: YES
        # Only its own API leaves it: what Automerge and its Rust core don't use is stripped, not exported.
        EXPORTED_SYMBOLS_FILE: AutomergeBridge/exports.txt
        DEAD_CODE_STRIPPING: YES
    dependencies:
      - package: Automerge
  BindersPhone:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Phone
      - path: PhoneShared
      - path: CaptureShared
      - path: WidgetShared
    info:
      path: Phone/Resources/Info.plist
      properties:
        CFBundleDisplayName: Binders
        # All-day capture's Live Activity: on the Lock Screen and in the Dynamic Island while capture is on.
        NSSupportsLiveActivities: true
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Dark by default: the launch screen is the dark ground, so no white flash comes before the app.
        UILaunchScreen:
          UIColorName: LaunchGround
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleURLTypes:
          - CFBundleURLName: io.binders.ios
            CFBundleURLSchemes: [binders]
            CFBundleTypeRole: Viewer
        NSLocalNetworkUsageDescription: Binders connects to Binders on your Mac over your network, so your to-dos, notes and meetings stay on your own devices.
        NSBonjourServices: [_binders._tcp]
        NSMicrophoneUsageDescription: Binders listens while you dictate, and while All-day capture is on, to write down your conversations and, if you turn it on, what you say to yourself; audio stays on this iPhone. After you dictate with the Binders keyboard, it keeps the microphone ready for five minutes so the next dictation starts at once; nothing is transcribed or kept until you tap the mic.
        NSSpeechRecognitionUsageDescription: Binders turns what you dictate into text on this iPhone.
        # The Binders keyboard can't use the microphone, so the app listens for it from the background; All-day capture
        # listens with the screen locked, and writes conversations down while the phone charges.
        UIBackgroundModes: [audio, processing]
        BGTaskSchedulerPermittedIdentifiers: [io.binders.app.conversations]
        # iOS 27 keeps background apps off the Neural Engine unless they hold the Background Inference entitlement
        # (com.apple.developer.background-tasks.continued-processing.inference, below; the App ID has the capability).
        # This says the build has it: All-day capture then writes conversations down in the background
        # (CaptureModels.mayInferInBackground). False and the entitlement removed go together.
        BindersBackgroundInference: true
        # Conversations shared as a Binders file, which Binders on the Mac opens.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: io.binders.transfer
            UTTypeDescription: Binders file
            UTTypeConformsTo: [public.data, public.content]
            UTTypeTagSpecification:
              public.filename-extension: [binders]
              public.mime-type: [application/x-binders]
        # Only the encryption built into iOS (TLS to your own Mac), which is exempt.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        # The App Store Connect record "Binders" (6751210657), taken over from the old events app at 2.0.
        PRODUCT_BUNDLE_IDENTIFIER: io.binders.app
        MARKETING_VERSION: "2.2"
        CURRENT_PROJECT_VERSION: "42"
        PRODUCT_NAME: Binders
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        # The recording "Process Sample File" runs All-day capture on, in debug builds only.
        Release:
          EXCLUDED_SOURCE_FILE_NAMES: capture-sample.caf
    entitlements:
      path: Phone/Resources/Binders.entitlements
      properties:
        com.apple.security.application-groups: [group.io.binders.app]
        # Background Inference: the Neural Engine with the app in the background (iOS 27), to write All-day capture's
        # conversations down while it listens.
        com.apple.developer.background-tasks.continued-processing.inference: true
    dependencies:
      - package: BindersKit
      # Parakeet, the diarizer and the voice detector for All-day capture, as on the Mac.
      - package: FluidAudio
      - target: BindersKeyboard
      - target: BindersWidgets
    scheme:
      testTargets: [BindersPhoneUITests]
  BindersWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Widgets
      - path: WidgetShared
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Binders
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/Widgets.entitlements
      properties:
        com.apple.security.application-groups: [group.io.binders.app]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.binders.app.widgets
        # Same as the app's: an extension's versions must match the app it's in.
        MARKETING_VERSION: "2.2"
        CURRENT_PROJECT_VERSION: "42"
        PRODUCT_NAME: BindersWidgets
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        APPLICATION_EXTENSION_API_ONLY: YES
    dependencies:
      # What the widgets read (WidgetSnapshot) and its rules: heard and done today, the busiest work stream.
      - package: BindersKit
  BindersKeyboard:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Keyboard
      - path: PhoneShared
      - path: WidgetShared/Palette.swift
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: Binders
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            # For the folder it shares with the app, where the app leaves your words.
            RequestsOpenAccess: true
    entitlements:
      path: Keyboard/Keyboard.entitlements
      properties:
        com.apple.security.application-groups: [group.io.binders.app]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.binders.app.keyboard
        # Same as the app's: an extension's versions must match the app it's in.
        MARKETING_VERSION: "2.2"
        CURRENT_PROJECT_VERSION: "42"
        PRODUCT_NAME: BindersKeyboard
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        APPLICATION_EXTENSION_API_ONLY: YES
    dependencies:
      # Its typing rules: deleting while held, the word being typed, which corrections are safe.
      - package: BindersKit
  BindersPhoneUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PhoneUITests
    dependencies:
      - target: BindersPhone
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.binders.app.uitests
        TEST_TARGET_NAME: BindersPhone
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        GENERATE_INFOPLIST_FILE: YES
