name: Binders
options:
  bundleIdPrefix: io.binders
  deploymentTarget:
    macOS: "14.2"
  createIntermediateGroups: true
packages:
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    from: 0.15.7
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit.git
    from: 1.1.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle.git
    from: 2.6.4
  BindersKit:
    path: Packages/BindersKit
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.2"
    DEVELOPMENT_TEAM: 87LFD98HJU
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development: Helder Feixas (2SNS7F6FAZ)"
    MARKETING_VERSION: "0.3.2"
    CURRENT_PROJECT_VERSION: "6"
targets:
  Binders:
    type: application
    platform: macOS
    sources:
      - path: Binders
    info:
      path: Binders/Resources/Info.plist
      properties:
        CFBundleName: Binders
        CFBundleDisplayName: Binders
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        CFBundleURLTypes:
          - CFBundleURLName: io.binders.mac
            CFBundleURLSchemes: [binders]
            CFBundleTypeRole: Viewer
        NSLocalNetworkUsageDescription: Binders lets the iPhones you pair with this Mac connect to it over your network, so your notes and to-dos stay on your own devices.
        NSBonjourServices: [_binders._tcp]
        NSMicrophoneUsageDescription: Binders listens only while you hold your dictation shortcut or record a meeting, and transcribes on this Mac.
        NSAudioCaptureUsageDescription: Binders records what other meeting participants say so it can take notes on this Mac.
        NSCalendarsFullAccessUsageDescription: Binders uses your calendar to title meetings and name attendees in meeting notes, and to add the events you ask for out loud.
        NSHumanReadableCopyright: © 2026 Helder Feixas
        SUFeedURL: https://binders.io/appcast.xml
        SUPublicEDKey: C/rZOrAgEm5p5fW21qnUggPEQxu3edbA42Qn7qd3BfE=
        SUScheduledCheckInterval: 86400
        SUEnableSystemProfiling: false
    entitlements:
      path: Binders/Resources/Binders.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.binders.mac
        PRODUCT_NAME: Binders
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
    dependencies:
      - package: FluidAudio
      - package: WhisperKit
        product: WhisperKit
      - package: Sparkle
      - package: BindersKit
  BindersPhone:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Phone
    info:
      path: Phone/Resources/Info.plist
      properties:
        CFBundleDisplayName: Binders
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleURLTypes:
          - CFBundleURLName: io.binders.ios
            CFBundleURLSchemes: [binders]
            CFBundleTypeRole: Viewer
        NSLocalNetworkUsageDescription: Binders connects to Binders on your Mac over your network, so your to-dos, notes and meetings stay on your own devices.
        NSBonjourServices: [_binders._tcp]
        # Only the encryption built into iOS (TLS to your own Mac), which is exempt.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        # The App Store Connect record "Binders" (6751210657), taken over from the old events app at 2.0.
        PRODUCT_BUNDLE_IDENTIFIER: io.binders.app
        MARKETING_VERSION: "2.0"
        CURRENT_PROJECT_VERSION: "2"
        PRODUCT_NAME: Binders
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - package: BindersKit
