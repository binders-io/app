name: Binders
options:
  bundleIdPrefix: io.binders
  deploymentTarget:
    macOS: "14.2"
  createIntermediateGroups: true
packages:
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    from: 0.15.7
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit.git
    from: 1.1.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle.git
    from: 2.6.4
  BindersKit:
    path: Packages/BindersKit
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.2"
    DEVELOPMENT_TEAM: 87LFD98HJU
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development: Helder Feixas (2SNS7F6FAZ)"
    MARKETING_VERSION: "0.5.0"
    CURRENT_PROJECT_VERSION: "10"
targets:
  Binders:
    type: application
    platform: macOS
    sources:
      - path: Binders
    info:
      path: Binders/Resources/Info.plist
      properties:
        CFBundleName: Binders
        CFBundleDisplayName: Binders
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        CFBundleURLTypes:
          - CFBundleURLName: io.binders.mac
            CFBundleURLSchemes: [binders]
            CFBundleTypeRole: Viewer
        NSLocalNetworkUsageDescription: Binders lets the iPhones you pair with this Mac connect to it over your network, so your notes and to-dos stay on your own devices.
        NSBonjourServices: [_binders._tcp]
        # A model server you run yourself (Ollama, llama.cpp, vLLM) is usually plain http, often on another machine over
        # Tailscale, and macOS only lets an app reach that if it allows it. Binders' own addresses are all https.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSMicrophoneUsageDescription: Binders listens only while you hold your dictation shortcut or record a meeting, and transcribes on this Mac.
        NSAudioCaptureUsageDescription: Binders records what other meeting participants say so it can take notes on this Mac.
        NSCalendarsFullAccessUsageDescription: Binders uses your calendar to title meetings and name attendees in meeting notes, and to add the events you ask for out loud.
        NSHumanReadableCopyright: © 2026 Helder Feixas
        SUFeedURL: https://binders.io/appcast.xml
        SUPublicEDKey: C/rZOrAgEm5p5fW21qnUggPEQxu3edbA42Qn7qd3BfE=
        SUScheduledCheckInterval: 86400
        SUEnableSystemProfiling: false
    entitlements:
      path: Binders/Resources/Binders.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.binders.mac
        PRODUCT_NAME: Binders
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
    dependencies:
      - package: FluidAudio
      - package: WhisperKit
        product: WhisperKit
      - package: Sparkle
      - package: BindersKit
  BindersPhone:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Phone
      - path: PhoneShared
    info:
      path: Phone/Resources/Info.plist
      properties:
        CFBundleDisplayName: Binders
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleURLTypes:
          - CFBundleURLName: io.binders.ios
            CFBundleURLSchemes: [binders]
            CFBundleTypeRole: Viewer
        NSLocalNetworkUsageDescription: Binders connects to Binders on your Mac over your network, so your to-dos, notes and meetings stay on your own devices.
        NSBonjourServices: [_binders._tcp]
        NSMicrophoneUsageDescription: Binders listens while you dictate. After you dictate with the Binders keyboard, it keeps the microphone ready for five minutes so the next dictation starts at once; nothing is transcribed or kept until you tap the mic.
        NSSpeechRecognitionUsageDescription: Binders turns what you dictate into text on this iPhone.
        # The Binders keyboard can't use the microphone, so the app listens for it from the background.
        UIBackgroundModes: [audio]
        # Only the encryption built into iOS (TLS to your own Mac), which is exempt.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        # The App Store Connect record "Binders" (6751210657), taken over from the old events app at 2.0.
        PRODUCT_BUNDLE_IDENTIFIER: io.binders.app
        MARKETING_VERSION: "2.0"
        CURRENT_PROJECT_VERSION: "6"
        PRODUCT_NAME: Binders
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    entitlements:
      path: Phone/Resources/Binders.entitlements
      properties:
        com.apple.security.application-groups: [group.io.binders.app]
    dependencies:
      - package: BindersKit
      - target: BindersKeyboard
    scheme:
      testTargets: [BindersPhoneUITests]
  BindersKeyboard:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Keyboard
      - path: PhoneShared
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: Binders
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            # For the folder it shares with the app, where the app leaves your words.
            RequestsOpenAccess: true
    entitlements:
      path: Keyboard/Keyboard.entitlements
      properties:
        com.apple.security.application-groups: [group.io.binders.app]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.binders.app.keyboard
        # Same as the app's: an extension's versions must match the app it's in.
        MARKETING_VERSION: "2.0"
        CURRENT_PROJECT_VERSION: "6"
        PRODUCT_NAME: BindersKeyboard
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        APPLICATION_EXTENSION_API_ONLY: YES
  BindersPhoneUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PhoneUITests
    dependencies:
      - target: BindersPhone
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.binders.app.uitests
        TEST_TARGET_NAME: BindersPhone
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        GENERATE_INFOPLIST_FILE: YES
